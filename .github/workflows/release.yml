name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-me:
    name: Create Github Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.print.outputs.version }}
    steps:
      - name: Run ReleaseMe
        id: release
        uses: dev-build-deploy/release-me@cede87fd8a4829ef571dff6bde807ebbfcaeb3e9 # v1.1.0
        with:
          token: ${{ github.token }}

      - if: ${{ steps.release.outputs.created }}
        id: print
        run: echo "version=${{ fromJSON(steps.release.outputs.release).tag_name }}" >> "$GITHUB_OUTPUT"

  publish:
    needs: release-me
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: 'sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" package.json'
        env:
          VERSION: ${{ needs.release-me.outputs.version }}
      - run: "bun install"
      - run: "(cd playground && bun install)"
      - run: "bun run dev:prepare"
      - run: "bun run prepack"
      - run: "npm publish --provenance --access public"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
